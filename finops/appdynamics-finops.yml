specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: AppDynamics
providerId: appdynamics
publisherName: Cisco Systems, Inc.
serviceCategory: Observability / APM
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - FinOps
  - FOCUS
  - APM
  - Observability
  - Cisco
description: 'FOCUS-aligned FinOps view for AppDynamics: per-vCPU annual subscriptions across three editions
  (Infrastructure $6, Premium $33, Enterprise $50 per vCPU/month) with usage-priced add-ons for RUM (per
  1,000 tokens) and Browser Synthetics (per test location). Allocation should track instrumented vCPUs
  per business unit and edition mix, with RUM token volume governed at the front-end build pipeline.'
sources:
  - https://www.splunk.com/en_us/products/pricing/observability.html
billingModel:
  pricingCategory: Subscription + Usage-Based
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Adjustment
focusColumns:
  ServiceName: AppDynamics
  ServiceCategory: Observability / APM
  ProviderName: Cisco AppDynamics
  PublisherName: Cisco Systems, Inc.
  InvoiceIssuerName: Cisco Systems, Inc.
  BillingCurrency: USD
  ChargeCategory: Purchase
  PricingCategory: Subscription
meters:
  - name: vcpu_months
    description: Instrumented vCPUs covered by the subscription, per month
    unit: vcpu-month
    aggregation: sum
    dimensions:
      - edition
      - business_unit
      - environment
  - name: rum_tokens
    description: Real User Monitoring tokens consumed (browser + mobile)
    unit: token
    aggregation: sum
    dimensions:
      - app
      - platform
  - name: synthetic_locations
    description: Active synthetic test locations per month
    unit: location
    aggregation: max
    dimensions:
      - app
  - name: secure_app_cpu_cores
    description: CPU cores covered by the Secure Application add-on
    unit: cpu-core
    aggregation: sum
    dimensions:
      - app
  - name: events_ingest
    description: Analytics events ingested into the AppDynamics Events Service
    unit: event
    aggregation: sum
    dimensions:
      - source
principles:
  - name: Visibility
    description: Use the AppDynamics Controller's License Usage and Account Management views and Cisco
      EA reporting to track vCPUs by app and edition; export to BigQuery/Snowflake for showback.
  - name: Allocation
    description: Tag instrumented hosts/agents with business-unit and environment labels; allocate vCPU
      consumption back to the consuming team.
  - name: Optimization
    description: Right-size editions per environment (Infrastructure for non-prod, Premium/Enterprise
      where APM is required); decommission unused agents; throttle RUM token sampling on high-traffic
      endpoints.
  - name: Accountability
    description: Platform/SRE owns the AppDynamics contract; service owners accountable for vCPU footprint
      and RUM token volume.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
