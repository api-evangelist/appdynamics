naftiko: 1.0.0-alpha2
info:
  label: Cisco Cloud Observability API — Query Service
  description: 'Cisco Cloud Observability API — Query Service. 1 operations. Lead operation: Execute a query. Self-contained
    Naftiko capability covering one Appdynamics business surface.'
  tags:
  - Appdynamics
  - Query Service
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APPDYNAMICS_API_KEY: APPDYNAMICS_API_KEY
capability:
  consumes:
  - type: http
    namespace: cloud-observability-query-service
    baseUri: https://{tenant}.observe.appdynamics.com/cloud
    description: Cisco Cloud Observability API — Query Service business capability. Self-contained, no shared references.
    resources:
    - name: v1-query-execute
      path: /v1/query/execute
      operations:
      - name: executequery
        method: POST
        description: Execute a query
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.APPDYNAMICS_API_KEY}}'
  exposes:
  - type: rest
    namespace: cloud-observability-query-service-rest
    port: 8080
    description: REST adapter for Cisco Cloud Observability API — Query Service. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v1/query/execute
      name: v1-query-execute
      description: REST surface for v1-query-execute.
      operations:
      - method: POST
        name: executequery
        description: Execute a query
        call: cloud-observability-query-service.executequery
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cloud-observability-query-service-mcp
    port: 9090
    transport: http
    description: MCP adapter for Cisco Cloud Observability API — Query Service. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: execute-query
      description: Execute a query
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: cloud-observability-query-service.executequery
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
