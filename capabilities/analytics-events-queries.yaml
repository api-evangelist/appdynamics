naftiko: 1.0.0-alpha2
info:
  label: AppDynamics Analytics Events API — Queries
  description: 'AppDynamics Analytics Events API — Queries. 1 operations. Lead operation: Query analytics events using ADQL.
    Self-contained Naftiko capability covering one Appdynamics business surface.'
  tags:
  - Appdynamics
  - Queries
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APPDYNAMICS_API_KEY: APPDYNAMICS_API_KEY
capability:
  consumes:
  - type: http
    namespace: analytics-events-queries
    baseUri: https://{events-service-host}:9080
    description: AppDynamics Analytics Events API — Queries business capability. Self-contained, no shared references.
    resources:
    - name: events-query
      path: /events/query
      operations:
      - name: queryevents
        method: POST
        description: Query analytics events using ADQL
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: start
          in: query
          type: string
          description: The start time for the query in ISO 8601 format or relative time notation.
        - name: end
          in: query
          type: string
          description: The end time for the query in ISO 8601 format or relative time notation.
        - name: limit
          in: query
          type: integer
          description: The maximum number of results to return.
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: X-Events-API-Key
      value: '{{env.APPDYNAMICS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: analytics-events-queries-rest
    port: 8080
    description: REST adapter for AppDynamics Analytics Events API — Queries. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/events/query
      name: events-query
      description: REST surface for events-query.
      operations:
      - method: POST
        name: queryevents
        description: Query analytics events using ADQL
        call: analytics-events-queries.queryevents
        with:
          start: rest.start
          end: rest.end
          limit: rest.limit
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: analytics-events-queries-mcp
    port: 9090
    transport: http
    description: MCP adapter for AppDynamics Analytics Events API — Queries. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: query-analytics-events-using-adql
      description: Query analytics events using ADQL
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: analytics-events-queries.queryevents
      with:
        start: tools.start
        end: tools.end
        limit: tools.limit
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
