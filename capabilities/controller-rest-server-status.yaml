naftiko: 1.0.0-alpha2
info:
  label: AppDynamics Controller REST API — Server Status
  description: 'AppDynamics Controller REST API — Server Status. 1 operations. Lead operation: Get Controller server status.
    Self-contained Naftiko capability covering one Appdynamics business surface.'
  tags:
  - Appdynamics
  - Server Status
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APPDYNAMICS_API_KEY: APPDYNAMICS_API_KEY
capability:
  consumes:
  - type: http
    namespace: controller-rest-server-status
    baseUri: https://{controller-host}/controller
    description: AppDynamics Controller REST API — Server Status business capability. Self-contained, no shared references.
    resources:
    - name: rest-serverstatus
      path: /rest/serverstatus
      operations:
      - name: getserverstatus
        method: GET
        description: Get Controller server status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.APPDYNAMICS_API_KEY}}'
  exposes:
  - type: rest
    namespace: controller-rest-server-status-rest
    port: 8080
    description: REST adapter for AppDynamics Controller REST API — Server Status. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/serverstatus
      name: rest-serverstatus
      description: REST surface for rest-serverstatus.
      operations:
      - method: GET
        name: getserverstatus
        description: Get Controller server status
        call: controller-rest-server-status.getserverstatus
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: controller-rest-server-status-mcp
    port: 9090
    transport: http
    description: MCP adapter for AppDynamics Controller REST API — Server Status. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: get-controller-server-status
      description: Get Controller server status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: controller-rest-server-status.getserverstatus
      outputParameters:
      - type: object
        mapping: $.
