openapi: 3.2.0
info:
  title: AppDynamics Configuration Actions Export/Import API
  description: The AppDynamics Configuration API provides endpoints for managing Controller configuration settings programmatically. It includes Configuration Import and Export capabilities that allow administrators to back up, restore, and migrate application configurations between Controller instances. Developers can automate the provisioning and management of application monitoring configurations, business transaction detection rules, and other Controller settings through this API.
  version: 23.x
  contact:
    name: Splunk AppDynamics Support
    url: https://www.appdynamics.com/support
  termsOfService: https://www.cisco.com/c/en/us/about/legal/cloud-and-software.html
servers:
- url: https://{controller-host}/controller
  description: AppDynamics Controller
  variables:
    controller-host:
      default: example.saas.appdynamics.com
      description: The hostname of your AppDynamics Controller instance.
security:
- bearerAuth: []
- basicAuth: []
tags:
- name: Actions Export/Import
  description: Export and import action configurations for alerting workflows.
paths:
  /actions/{applicationId}:
    get:
      operationId: exportActions
      summary: Export actions for an application
      description: Exports all action configurations for the specified application as an XML document.
      tags:
      - Actions Export/Import
      parameters:
      - $ref: '#/components/parameters/applicationId'
      responses:
        '200':
          description: Successful export of action configurations
          content:
            application/xml:
              schema:
                type: string
                description: XML representation of the action configurations.
        '401':
          description: Unauthorized - invalid or missing credentials
        '404':
          description: Application not found
    post:
      operationId: importActions
      summary: Import actions for an application
      description: Imports action configurations from an XML file into the specified application.
      tags:
      - Actions Export/Import
      parameters:
      - $ref: '#/components/parameters/applicationId'
      - name: overwrite
        in: query
        required: false
        description: When true, overwrites existing actions with matching names.
        schema:
          type: boolean
          default: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The XML file containing the action configurations to import.
      responses:
        '200':
          description: Actions imported successfully
        '400':
          description: Bad request - invalid action configuration
        '401':
          description: Unauthorized - invalid or missing credentials
        '404':
          description: Application not found
components:
  parameters:
    applicationId:
      name: applicationId
      in: path
      required: true
      description: The numeric ID of the business application.
      schema:
        type: integer
        format: int64
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: OAuth 2.0 access token obtained from the /controller/api/oauth/access_token endpoint.
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication using user@account:password format.
externalDocs:
  description: Configuration Import and Export API Documentation
  url: https://docs.appdynamics.com/appd/23.x/latest/en/extend-appdynamics/appdynamics-apis/configuration-import-and-export-api
