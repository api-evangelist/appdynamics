name: AppDynamics Domain Vocabulary
provider: AppDynamics
providerId: appdynamics
description: Tag-derived vocabulary for the AppDynamics API surface; sourced from openapi/ tags.
terms:
- term: Configurations
  description: Configure data collection settings for cloud connections including service selection, region filtering, and
    resource group scoping.
- term: Connections
  description: Manage cloud provider connections for AWS, Azure, and GCP to enable automated cloud monitoring at scale.
- term: Health Rules
  description: Manage health rules that define performance thresholds and violation conditions for monitored cloud entities.
- term: Query Service
  description: Query MELT observation data using the Cisco AppDynamics domain-specific query language.
- term: Reference Data
  description: Retrieve lists of supported cloud regions and services for connection configuration.
